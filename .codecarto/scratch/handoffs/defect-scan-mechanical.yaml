  - "Routed items arch-CF3 and arch-CF4 closed: arch-CF3 -> findings P6-1 (unpinned engine/embed downloads), P6-2 (per-model CTX_SIZE/KV_CACHE_TYPE divergence), P6-3 (batch-only password check looseness); arch-CF4 -> findings P1-3 (logit bias broken) and P1-4 (Tekken-tokenizer patch)."
