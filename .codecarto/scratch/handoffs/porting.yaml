proposed_conventions:
  - name: porting-bundle-is-the-compression-boundary
    rule: "The reimplementation-spec phase starts from findings/porting/reverse-engineering-bundle.md alone and deep-reads upstream reports only on the triggers named in the bundle's Source Index; any claim the bundle cannot support must be routed back as a gap, not silently re-derived from upstream."
    evidence: "GUIDE.md §Synthesis compression boundary; this phase's Source Index names the exact deep-read trigger for each upstream artifact and secondary output."
closeout_summary: "Porting phase complete: reverse-engineering bundle synthesized from all five upstream artifacts (55 feature contracts, 34 defects, 28 portability hazards, protocol/state notes, Source Index with deep-read triggers); arch-CF6 closed; five secondary outputs appended; validation PASS (7/7)."
closeout_content: |-
  # Closeout — porting

  ## Summary

  - Synthesized the reverse-engineering bundle at findings/porting/reverse-engineering-bundle.md from architecture, contracts, protocols, mechanical defects, and semantic defects.
  - Layer map uses concept names (product shell, provider adapter, message normalizer, agent loop, session store, tool executor, render loop/UI surface, hardware probe) — the target must not mirror the source folder layout.
  - Feature contract table: 55 rows with porting priority (core 19 / important 22 / optional 12 / incidental 2), each referencing the upstream contract and relevant defect findings with dispositions.
  - Defect synthesis: all 34 findings (17 mechanical + 17 semantic) grouped by disposition — fix before porting 12, port differently 15, leave behind 7 — each with a required design consequence.
  - Portability hazards: 28 rows consolidating all prior phases; closes arch-CF6.
  - Source Index: deep-read triggers for every upstream artifact and all five secondary outputs, making the bundle the self-contained compression boundary for reimplementation-spec.
  - Validation: PASS (7/7 criteria).

  ## Decisions Beyond Prompt

  - Followed the contracts file's actual 55 sections over the owner_notes' claimed 40; discrepancy surfaced for the orchestrator.
  - Carried defect dispositions forward verbatim; no re-adjudication.
  - Security-posture items stay 'port differently' per D009.

  ## Proposed Conventions

  - porting-bundle-is-the-compression-boundary (staged in CONVENTIONS.md under Pending proposals).

  ## Carry-Forward

  - porting-CF1 → reimplementation-spec: run the Strategic Alignment Hook before the spec phase.
