open_questions:
  - id: q-ollama-api-version
    kind: needs-runtime-test
    description: "The search proxy forwards to https://ollama.com/api + path; the exact web_search request/response contract and its stability are not pinned in-repo. The protocols phase decoded the proxy (verbatim forwarder) and the client (request {query, max_results}, response {results:[{title,content,url}]}) — the upstream schema beyond that remains invisible."
    deferred_reason: "Requires a live capture against Ollama's API."
  - id: q-websearch-response-fields
    kind: needs-runtime-test
    description: "Refines q-ollama-api-version: the client reads only title/content/url per result (11-search.js:184-190); whether the upstream returns additional fields and whether max_results is honored is unknown."
    deferred_reason: "Proxy forwards verbatim; not visible in-repo."
  - id: q-sse-done-marker
    kind: needs-runtime-test
    description: "Whether the pinned llama-server build (b9294) terminates streams with 'data: [DONE]' or simply closes the connection. The client handles both (02-model.js:414, feeder flush on EOF), but the spooled transcript's exact terminal bytes are unverifiable from source."
    deferred_reason: "Requires a live capture against the pinned build."
  - id: q-llama-server-diag-endpoints
    kind: needs-runtime-test
    description: "gobboDiag() calls GET /props and POST /apply-template (06-state-sync.js:589-600); their exact response shapes are not documented in-repo (diagnostic-only, not load-bearing)."
    deferred_reason: "Requires a live call against the pinned build."
carry_forward:
  - id: proto-CF1
    kind: defer-to-phase
    target_phase: defect-scan-semantic
    description: "Session expiry mid-generation: the job poll returns 401 -> the client treats it as terminal, clears the breadcrumb, and DELETEs the job — which flags cancel and kills the still-running generation (03-generation.js:375, 452-465; fileserver.ps1:872-880). The error message ('reload the page and sign in to re-attach') promises re-attachment the code path has already foreclosed. Assess as a pass-5 contract violation (error behavior vs actual behavior)."
    deferred_reason: "Contract-drift assessment is pass 5 of the semantic scan."
  - id: proto-CF2
    kind: defer-to-phase
    target_phase: defect-scan-semantic
    description: "Swap readiness promotion is lazy (only advances when /swap-status is polled, fileserver.ps1:1380-1383). If the client stops polling mid-swap (tab closed), the .swap-in-progress lock persists and launch.bat's monitor loop stands down indefinitely (launch.bat:1845-1858) — no crash-restart protection until the next fileserver boot. Assess as a pass-3 concurrency/lifecycle defect."
    deferred_reason: "Concurrency is pass 3 of the semantic scan."
carry_forward_closures:
  - arch-CF1
